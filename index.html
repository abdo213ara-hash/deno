<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus - Live Voice & Audio Hub</title>
    <!-- مكتبة PeerJS للاتصال الصوتي المباشر بين الأجهزة -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; display: flex; height: 100vh; overflow: hidden; direction: ltr; }
        
        /* Hub Sidebar */
        .hub-sidebar { width: 80px; background: #010409; display: flex; flex-direction: column; align-items: center; padding-top: 15px; gap: 12px; border-right: 1px solid #30363d; }
        .hub-icon { width: 50px; height: 50px; background: #161b22; border-radius: 14px; display: flex; justify-content: center; align-items: center; color: #58a6ff; font-weight: bold; cursor: pointer; transition: 0.3s; border: 1px solid #30363d; }
        .hub-icon:hover, .hub-icon.active { background: #1f6feb; color: #fff; border-color: #58a6ff; box-shadow: 0 0 15px rgba(31, 111, 235, 0.4); }

        /* Rooms Panel */
        .rooms-panel { width: 280px; background: #161b22; display: flex; flex-direction: column; border-right: 1px solid #30363d; }
        .panel-header { padding: 18px; font-weight: bold; color: #fff; border-bottom: 1px solid #30363d; font-size: 16px; background: #0d1117; }
        .rooms-list { padding: 12px; overflow-y: auto; flex: 1; }
        .section-title { font-size: 11px; color: #8b949e; font-weight: bold; margin: 12px 0 6px 6px; text-transform: uppercase; letter-spacing: 1px; }
        
        .room-card { padding: 10px 14px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; color: #8b949e; margin-bottom: 6px; font-size: 14px; background: #0d1117; border: 1px solid transparent; transition: 0.2s; }
        .room-card:hover { background: #21262d; color: #c9d1d9; border-color: #30363d; }
        .room-card.connected { background: rgba(35, 134, 54, 0.15); color: #3fb950; border-color: #2ea043; font-weight: bold; }

        /* User Profile Footer */
        .user-panel { background: #0d1117; padding: 12px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #30363d; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 36px; height: 36px; background: linear-gradient(135deg, #1f6feb, #8957e5); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #fff; font-weight: bold; }
        .user-name { font-size: 13px; font-weight: bold; color: #fff; }
        .user-status { font-size: 11px; color: #3fb950; }

        /* Main Stage Area */
        .main-stage { flex: 1; background: #0d1117; display: flex; flex-direction: column; justify-content: space-between; }
        .stage-header { padding: 18px 24px; font-size: 16px; font-weight: bold; color: #fff; border-bottom: 1px solid #30363d; display: flex; align-items: center; justify-content: space-between; }
        
        .stage-view { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; }
        .audio-pulse-circle { width: 120px; height: 120px; background: rgba(31, 111, 235, 0.1); border: 2px solid #1f6feb; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 40px; margin-bottom: 20px; box-shadow: 0 0 30px rgba(31, 111, 235, 0.2); transition: 0.3s; }
        .audio-pulse-circle.active { border-color: #3fb950; background: rgba(63, 185, 80, 0.15); box-shadow: 0 0 40px rgba(63, 185, 80, 0.3); }

        .connection-box { background: #161b22; border: 1px solid #30363d; padding: 15px; border-radius: 10px; width: 350px; margin-top: 15px; text-align: left; }
        .connection-box label { font-size: 12px; color: #8b949e; display: block; margin-bottom: 4px; }
        .id-display { background: #0d1117; border: 1px solid #30363d; padding: 8px; border-radius: 6px; font-size: 12px; color: #58a6ff; word-break: break-all; margin-bottom: 10px; }
        input { width: 100%; background: #0d1117; border: 1px solid #30363d; padding: 8px; border-radius: 6px; color: #fff; margin-bottom: 8px; font-size: 13px; }
        input:focus { border-color: #1f6feb; outline: none; }

        /* Bottom Control Bar */
        .control-bar { background: #161b22; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #30363d; }
        .connection-indicator { font-size: 13px; color: #8b949e; font-weight: bold; display: flex; align-items: center; gap: 6px; }
        .dot { width: 8px; height: 8px; background: #8b949e; border-radius: 50%; display: inline-block; }
        .dot.online { background: #3fb950; box-shadow: 0 0 8px #3fb950; }
        
        .btn-group { display: flex; gap: 10px; }
        .action-btn { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; transition: 0.2s; }
        .action-btn:hover { background: #30363d; color: #fff; }
        .action-btn.success { background: #238636; border-color: #2ea043; color: #fff; }
        .action-btn.success:hover { background: #2ea043; }
        .action-btn.danger { background: rgba(248, 81, 73, 0.15); border-color: #f85149; color: #f85149; }
        .action-btn.danger:hover { background: #f85149; color: #fff; }
        .action-btn.warning { background: rgba(210, 153, 34, 0.15); border-color: #d29922; color: #d29922; }
        .action-btn.warning:hover { background: #d29922; color: #fff; }
    </style>
</head>
<body>

    <!-- Hub Sidebar -->
    <div class="hub-sidebar">
        <div class="hub-icon active" title="Main Hub">⚡</div>
        <div class="hub-icon" title="Gaming Lounge">🎮</div>
        <div class="hub-icon" title="Podcasts">🎙️</div>
    </div>

    <!-- Rooms Panel -->
    <div class="rooms-panel">
        <div class="panel-header">Nexus Audio Hub</div>
        
        <div class="rooms-list">
            <div class="section-title">Voice Channels</div>
            <div class="room-card connected" id="r-main" onclick="switchRoom('Main Stage', 'r-main')">
                <span>🎙️ Main Stage</span>
                <span style="font-size: 11px; color: #3fb950;">Active</span>
            </div>
            <div class="room-card" id="r-gaming" onclick="switchRoom('Gaming Squad', 'r-gaming')">
                <span>🎮 Gaming Squad</span>
                <span style="font-size: 11px; color: #8b949e;">Idle</span>
            </div>
        </div>

        <div class="user-panel">
            <div class="user-info">
                <div class="user-avatar">A</div>
                <div>
                    <div class="user-name">Abdul</div>
                    <div class="user-status" id="micStatusText">● Ready</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Stage -->
    <div class="main-stage">
        <div class="stage-header">
            <span id="activeRoomTitle">Active Room: Main Stage</span>
            <span style="font-size: 12px; color: #8b949e;" id="pingLabel">Server Latency: Optimal</span>
        </div>

        <div class="stage-view">
            <div class="audio-pulse-circle" id="pulseBox">
                🎙️
            </div>
            <h3 id="statusHeading" style="color: #fff; margin-bottom: 6px;">Voice Hub Initialized</h3>
            <p style="color: #8b949e; font-size: 13px;" id="subStatusText">Share your ID with your friend or enter their ID to start talking.</p>

            <!-- Connection Controls Box -->
            <div class="connection-box">
                <label>Your Connection ID (Give this to your friend):</label>
                <div class="id-display" id="myId">Generating ID...</div>
                
                <label>Friend's ID:</label>
                <input type="text" id="friendIdInput" placeholder="Paste your friend's ID here...">
                <button class="action-btn success" style="width: 100%;" onclick="connectToFriend()">Connect to Friend 📞</button>
            </div>
        </div>

        <!-- Bottom Control Bar -->
        <div class="control-bar">
            <div class="connection-indicator">
                <span class="dot" id="statusDot"></span>
                <span id="connLabel">Disconnected</span>
            </div>
            <div class="btn-group">
                <button class="action-btn warning" id="muteBtn" style="display:none;" onclick="toggleMute()">Mute 🎤</button>
                <button class="action-btn warning" id="deafenBtn" style="display:none;" onclick="toggleDeafen()">Deafen 🎧</button>
                <button class="action-btn danger" id="endBtn" style="display:none;" onclick="endCall()">Leave Call 📴</button>
            </div>
        </div>
    </div>

    <!-- عنصر لتشغيل صوت الطرف الآخر -->
    <audio id="remoteAudio" autoplay></audio>

    <script>
        let peer;
        let activeConnection;
        let localStream;
        let isMuted = false;
        let isDeafened = false;

        const peerOptions = {
            config: {
                'iceServers': [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            }
        };

        peer = new Peer(peerOptions);

        peer.on('open', (id) => {
            document.getElementById('myId').innerText = id;
            document.getElementById('statusHeading').innerText = "Connected to Server";
            document.getElementById('statusDot').className = "dot online";
            document.getElementById('connLabel').innerText = "Server Ready";
        });

        peer.on('call', async (call) => {
            document.getElementById('statusHeading').innerText = "Incoming Call...";
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                call.answer(localStream);
                
                call.on('stream', (remoteStream) => {
                    handleActiveCall(remoteStream);
                });

                activeConnection = call;
            } catch (err) {
                alert("Please allow microphone permissions in your browser.");
            }
        });

        async function connectToFriend() {
            const friendId = document.getElementById('friendIdInput').value.trim();
            if (!friendId) {
                alert("Please enter your friend's ID first!");
                return;
            }

            document.getElementById('statusHeading').innerText = "Connecting to friend...";

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                
                const call = peer.call(friendId, localStream);
                
                call.on('stream', (remoteStream) => {
                    handleActiveCall(remoteStream);
                });

                call.on('close', () => {
                    endCall();
                });

                activeConnection = call;
            } catch (err) {
                alert("Could not access microphone or establish connection.");
                document.getElementById('statusHeading').innerText = "Connection Failed";
            }
        }

        function handleActiveCall(stream) {
            const audioElem = document.getElementById('remoteAudio');
            audioElem.srcObject = stream;
            audioElem.muted = isDeafened;
            audioElem.play();
            
            document.getElementById('statusHeading').innerText = "🟢 Live Call Active!";
            document.getElementById('subStatusText').innerText = "You are now speaking with your friend.";
            document.getElementById('pulseBox').classList.add('active');
            document.getElementById('statusDot').className = "dot online";
            document.getElementById('connLabel').innerText = "Voice Connected (P2P)";
            document.getElementById('micStatusText').innerText = "● In Call";
            
            document.getElementById('muteBtn').style.display = "block";
            document.getElementById('deafenBtn').style.display = "block";
            document.getElementById('endBtn').style.display = "block";
        }

        function toggleMute() {
            if (!localStream) return;
            isMuted = !isMuted;
            localStream.getAudioTracks()[0].enabled = !isMuted;
            
            const muteBtn = document.getElementById('muteBtn');
            if (isMuted) {
                muteBtn.innerText = "Unmute 🎤";
                muteBtn.style.background = "rgba(248, 81, 73, 0.15)";
                muteBtn.style.borderColor = "#f85149";
                muteBtn.style.color = "#f85149";
                document.getElementById('micStatusText').innerText = "● Muted";
            } else {
                muteBtn.innerText = "Mute 🎤";
                muteBtn.style.background = "";
                muteBtn.style.borderColor = "";
                muteBtn.style.color = "";
                document.getElementById('micStatusText').innerText = "● In Call";
            }
        }

        function toggleDeafen() {
            isDeafened = !isDeafened;
            const remoteAudio = document.getElementById('remoteAudio');
            remoteAudio.muted = isDeafened;

            const deafenBtn = document.getElementById('deafenBtn');
            if (isDeafened) {
                deafenBtn.innerText = "Undeafen 🎧";
                deafenBtn.style.background = "rgba(248, 81, 73, 0.15)";
                deafenBtn.style.borderColor = "#f85149";
                deafenBtn.style.color = "#f85149";
                
                if (!isMuted) {
                    toggleMute();
                }
            } else {
                deafenBtn.innerText = "Deafen 🎧";
                deafenBtn.style.background = "";
                deafenBtn.style.borderColor = "";
                deafenBtn.style.color = "";
            }
        }

        function switchRoom(roomName, elementId) {
            document.getElementById('activeRoomTitle').innerText = `Active Room: ${roomName}`;
            document.querySelectorAll('.room-card').forEach(card => card.classList.remove('connected'));
            document.getElementById(elementId).classList.add('connected');
        }

        function endCall() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            if (activeConnection) {
                activeConnection.close();
            }
            
            isMuted = false;
            isDeafened = false;
            document.getElementById('remoteAudio').muted = false;

            document.getElementById('statusHeading').innerText = "Call Ended";
            document.getElementById('subStatusText').innerText = "Share your ID or enter a friend's ID to reconnect.";
            document.getElementById('pulseBox').classList.remove('active');
            document.getElementById('statusDot').className = "dot online";
            document.getElementById('connLabel').innerText = "Server Ready";
            document.getElementById('micStatusText').innerText = "● Ready";
            
            document.getElementById('muteBtn').style.display = "none";
            document.getElementById('deafenBtn').style.display = "none";
            document.getElementById('endBtn').style.display = "none";
        }
    </script>
</body>
</html>
